name: ci
on:
  pull_request:
    branches: [develop, stage, main]
  push:
    branches: [develop]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  agents-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: meta
          path: .meta
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: .meta
      - run: node .meta/scripts/agents-sync.mjs install --repo "$GITHUB_WORKSPACE" --check

  promotion-gate:
    if: github.event_name == 'pull_request' && (github.base_ref == 'stage' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_promotion.py
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
