name: meta
on:
  pull_request:
    branches: [meta]
  push:
    branches: [meta]
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run agents:check
      - run: npm run spec:validate
