<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Attune demo stage</title>
<!--
  Recording stage for the demo video. Frames the live app (same origin) in a desktop window and a phone, with
  titles, captions, a cursor and highlights. Driven by record.mjs through window.stage. Colors and type mirror
  apps/web/src/design/tokens.ts; this file can't import them because it is served as plain HTML.
-->
<style>
  @font-face { font-family: "Instrument Sans"; font-weight: 400; src: url("/fonts/instrument-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 500; src: url("/fonts/instrument-sans-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 600; src: url("/fonts/instrument-sans-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
  :root { --wine:#5A1428; --raspberry:#8E3853; --rose:#AE6679; --clay:#C2A08B; --blush:#F0C9C8; --bone:#F4EBE4; --cream:#FAF4EE; --forest:#2E3A2A; --muted:#5B6355; --hair:#E2D5CA; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bone); color: var(--forest); font-family: "Instrument Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .grain::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .08  0 0 0 0 .16  0 0 0 .14 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #bg { position: absolute; inset: 0; background:
    radial-gradient(38% 30% at 6% 100%, rgba(240,201,200,.9), rgba(240,201,200,0) 70%),
    radial-gradient(30% 26% at 96% 96%, rgba(174,102,121,.32), rgba(174,102,121,0) 70%),
    radial-gradient(34% 26% at 100% 0%, rgba(194,160,139,.28), rgba(194,160,139,0) 70%), var(--bone); }
  .fade { transition: opacity .55s ease, transform .55s ease; }
  .hidden { opacity: 0; transform: translateY(8px); }
  #head { position: absolute; left: 120px; top: 56px; right: 120px; }
  .overline { font-size: 17px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--raspberry); }
  .title { font-family: "Instrument Serif", serif; font-style: italic; font-size: 64px; line-height: 1.02; margin-top: 8px; letter-spacing: -.01em; }
  #step { position: absolute; right: 0; top: 0; font-size: 17px; font-weight: 600; letter-spacing: .2em; color: var(--raspberry); }
  #caption { position: absolute; left: 120px; right: 120px; top: 958px; font-size: 27px; line-height: 1.4; max-width: 1560px; text-wrap: balance; }
  .frame { position: absolute; transition: opacity .5s ease; }
  #desktop { background: var(--cream); border-radius: 16px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(90,20,40,.35), 0 2px 4px rgba(46,58,42,.08); }
  #desktop .bar { height: 42px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--hair); font-size: 16px; color: var(--muted); }
  #desktop .dot { width: 10px; height: 10px; border-radius: 5px; background: var(--hair); }
  #desktop iframe { display: block; border: 0; background: var(--bone); }
  #phone { background: #FBF6F1; border-radius: 52px; padding: 13px; box-shadow: 0 40px 70px -34px rgba(90,20,40,.45), 0 0 0 1px rgba(194,160,139,.35); }
  #phone iframe { display: block; border: 0; border-radius: 40px; background: var(--bone); }
  #log { background: var(--forest); color: var(--cream); border-radius: 16px; padding: 26px 30px; box-sizing: border-box; font-size: 19px; line-height: 1.5; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(46,58,42,.5); }
  #log .k { color: var(--blush); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 15px; }
  #log .row { margin-top: 18px; opacity: 0; transform: translateY(6px); transition: all .45s ease; }
  #log .row.on { opacity: 1; transform: none; }
  #log .tool { font-weight: 600; }
  #log .arg { color: #E9DCCF; }
  #log .ok { color: #CFE0C2; }
  #log .note { margin-top: 22px; color: #D9CBBE; font-size: 16px; }
  #cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 60; transition: transform .85s cubic-bezier(.22,.8,.2,1), opacity .4s; opacity: 0; pointer-events: none; }
  .ripple { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid var(--raspberry); z-index: 59; pointer-events: none; animation: rip .6s ease-out forwards; }
  @keyframes rip { from { transform: scale(.4); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
  #spot { position: absolute; z-index: 55; border: 3px solid var(--raspberry); border-radius: 12px; box-shadow: 0 0 0 9px rgba(240,201,200,.6); opacity: 0; transition: all .45s ease; pointer-events: none; }
  #card { position: absolute; inset: 0; z-index: 80; display: flex; flex-direction: column; justify-content: center; padding: 0 180px; color: var(--cream); transition: opacity .7s ease; opacity: 0; pointer-events: none;
    background: radial-gradient(36% 30% at 88% 20%, rgba(142,56,83,.6), rgba(142,56,83,0) 70%), radial-gradient(40% 32% at 10% 96%, rgba(240,201,200,.55), rgba(240,201,200,0) 70%), radial-gradient(30% 24% at 74% 100%, rgba(194,160,139,.45), rgba(194,160,139,0) 70%), var(--wine); }
  #card .mark { display: flex; align-items: center; gap: 14px; font-family: "Instrument Serif", serif; font-style: italic; font-size: 44px; }
  #card .big { font-family: "Instrument Serif", serif; font-style: italic; font-size: 104px; line-height: 1; margin-top: 40px; max-width: 1400px; letter-spacing: -.015em; }
  #card .sub { font-size: 30px; color: var(--blush); margin-top: 28px; max-width: 1300px; line-height: 1.4; }
  #card .lines { margin-top: 36px; font-size: 26px; color: var(--cream); line-height: 1.7; }
  #points { position: absolute; left: 120px; top: 330px; width: 980px; }
  #points div { font-family: "Instrument Serif", serif; font-style: italic; font-size: 46px; line-height: 1.15; margin-bottom: 30px; opacity: 0; transform: translateY(8px); transition: all .6s ease; }
  #points div.on { opacity: 1; transform: none; }
  #points div::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 7px; background: var(--rose); margin-right: 20px; vertical-align: middle; }
  #badge { position: absolute; right: 120px; bottom: 24px; font-size: 15px; color: var(--muted); letter-spacing: .04em; z-index: 70; }
</style>
</head>
<body>
<div id="bg" class="grain"></div>
<div id="head" class="fade hidden"><div class="overline" id="overline"></div><div class="title" id="title"></div><div id="step"></div></div>
<div id="desktop" class="frame" style="opacity:0"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="dlabel"></span></div><iframe id="dframe" title="desktop"></iframe></div>
<div id="phone" class="frame" style="opacity:0"><iframe id="pframe" title="phone"></iframe></div>
<div id="log" class="frame" style="opacity:0"></div>
<div id="points"></div>
<div id="caption" class="fade hidden"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 30 30"><path d="M5 3 L5 24 L10.5 18.8 L14.6 27.5 L18.4 25.8 L14.4 17.3 L22 17.3 Z" fill="#2E3A2A" stroke="#FAF4EE" stroke-width="1.8" stroke-linejoin="round"/></svg>
<div id="card"><div class="mark"><svg width="56" height="56" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#FAF4EE"/><g transform="translate(16 16.5)" fill="#AE6679"><ellipse cx="0" cy="-6" rx="3.6" ry="6"/><ellipse cx="0" cy="-6" rx="3.6" ry="6" transform="rotate(72)"/><ellipse cx="0" cy="-6" rx="3.6" ry="6" transform="rotate(144)"/><ellipse cx="0" cy="-6" rx="3.6" ry="6" transform="rotate(216)"/><ellipse cx="0" cy="-6" rx="3.6" ry="6" transform="rotate(288)"/></g><circle cx="16" cy="16.5" r="2.6" fill="#FAF4EE"/></svg>Attune</div><div class="big" id="cbig"></div><div class="sub" id="csub"></div><div class="lines" id="clines"></div></div>
<div id="badge">Prototype · synthetic data</div>
<iframe id="ctl" title="controls" style="position:absolute;left:-4000px;top:0;width:1200px;height:900px;border:0"></iframe>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const LAYOUT = {
  split: { desktop: [120, 222, 1220, 712], phone: [1392, 212, 408, 732] },
  phone: { phone: [1250, 150, 408, 800] },
  desktop: { desktop: [120, 222, 1680, 712] },
  log: { log: [120, 222, 1150, 712], phone: [1392, 212, 408, 732] },
};
const frames = { desktop: $("dframe"), phone: $("pframe"), ctl: $("ctl") };
const HIDE = "[data-demo-bar]{display:none!important}html{scrollbar-width:none}::-webkit-scrollbar{display:none}";

function place(name, box) {
  const el = $(name);
  if (!box) { el.style.opacity = 0; return; }
  const [x, y, w, h] = box;
  Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  if (name === "desktop") Object.assign(frames.desktop.style, { width: w + "px", height: h - 43 + "px" });
  if (name === "phone") Object.assign(frames.phone.style, { width: w - 26 + "px", height: h - 26 + "px" });
  el.style.opacity = 1;
}

/** Where a frame really is: the app navigates itself (e.g. "Open Patient Pack"), so ask the frame. */
function locationOf(f) {
  try { return f.contentDocument.readyState === "complete" ? f.contentWindow.location.href : ""; } catch { return ""; }
}

function load(frame, url) {
  const f = frames[frame];
  const target = new URL(url, location.href).href;
  const now = locationOf(f);
  if (now === target) return Promise.resolve();
  if (now && now !== "about:blank" && now.split("#")[0] === target.split("#")[0]) { f.contentWindow.location.hash = new URL(target).hash; return sleep(900); }
  return new Promise((resolve) => {
    f.addEventListener("load", () => {
      try { const s = f.contentDocument.createElement("style"); s.textContent = HIDE; f.contentDocument.head.appendChild(s); } catch {}
      setTimeout(resolve, 900);
    }, { once: true });
    f.src = target;
  });
}

/** A control by its label, then any element by visible text (deepest match), or a CSS selector with "css:". */
function find(frame, query) {
  const doc = frames[frame].contentDocument;
  if (query.startsWith("css:")) return doc.querySelector(query.slice(4));
  const els = [...doc.querySelectorAll("button, a, [role=switch], [role=radio], textarea, input")].filter((e) => !e.disabled);
  const control = els.find((e) => (e.textContent || e.getAttribute("aria-label") || "").trim().startsWith(query));
  if (control) return control;
  // Deepest element whose text contains the query; React often splits one phrase across several text nodes.
  const matches = [...doc.body.querySelectorAll("*")].filter((e) => e.textContent.includes(query) && e.getClientRects().length > 0);
  return matches.find((e) => ![...e.children].some((c) => c.textContent.includes(query))) || null;
}

function stageRect(frame, el) {
  const f = frames[frame].getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: f.left + r.left, y: f.top + r.top, w: r.width, h: r.height };
}

window.stage = {
  async controls(url, labels) {
    await load("ctl", url);
    for (const l of labels) { const el = find("ctl", l); if (!el) return `missing control: ${l}`; el.click(); await sleep(500); }
    return "ok";
  },
  async scene({ layout, overline, title, step, caption, desktop, phone, dlabel, points }) {
    $("head").classList.add("hidden"); $("caption").classList.add("hidden");
    [...$("points").children].forEach((d) => d.classList.remove("on"));
    await sleep(450);
    $("points").innerHTML = (points || []).map((p) => `<div>${p}</div>`).join("");
    const boxes = LAYOUT[layout];
    for (const n of ["desktop", "phone", "log"]) if (!boxes[n]) place(n, null);
    if (layout === "log") { $("log").innerHTML = ""; }
    const jobs = [];
    if (desktop) jobs.push(load("desktop", desktop));
    if (phone) jobs.push(load("phone", phone));
    await Promise.all(jobs);
    for (const n of ["desktop", "phone", "log"]) if (boxes[n]) place(n, boxes[n]);
    if (dlabel !== undefined) $("dlabel").textContent = dlabel;
    $("overline").textContent = overline; $("title").textContent = title; $("step").textContent = step || ""; $("caption").textContent = caption;
    await sleep(150);
    $("head").classList.remove("hidden"); $("caption").classList.remove("hidden");
    await sleep(600);
  },
  async reveal(i) { const d = $("points").children[i]; if (d) d.classList.add("on"); await sleep(700); },
  async go(frame, url, label) { if (label !== undefined) $("dlabel").textContent = label; await load(frame, url); },
  async card({ big, sub, lines }) {
    $("cbig").textContent = big; $("csub").textContent = sub || ""; $("clines").innerHTML = (lines || []).map((l) => `<div>${l}</div>`).join("");
    $("card").style.opacity = 1; await sleep(800);
  },
  async uncard() { $("card").style.opacity = 0; await sleep(800); },
  async point(frame, query, { click = false, wait = 0 } = {}) {
    const el = find(frame, query);
    if (!el) return `missing: ${query}`;
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    await sleep(700);
    const r = stageRect(frame, el);
    const c = $("cursor"); c.style.opacity = 1;
    c.style.transform = `translate(${r.x + r.w / 2 - 5}px, ${r.y + r.h / 2 - 3}px)`;
    await sleep(950);
    if (click) {
      const rip = document.createElement("div"); rip.className = "ripple"; rip.style.left = r.x + r.w / 2 + "px"; rip.style.top = r.y + r.h / 2 + "px";
      document.body.appendChild(rip); setTimeout(() => rip.remove(), 700);
      await sleep(120); el.click();
    }
    await sleep(wait);
    return "ok";
  },
  hideCursor() { $("cursor").style.opacity = 0; },
  /** Wait until a frame shows some text (the app syncs on its own clock). */
  async waitFor(frame, text, ms = 12000) {
    const until = Date.now() + ms;
    while (Date.now() < until) {
      try { if (frames[frame].contentDocument.body.innerText.includes(text)) return "ok"; } catch {}
      await sleep(250);
    }
    return `timed out waiting for: ${text}`;
  },
  async spot(frame, query, ms = 1800) {
    const el = find(frame, query);
    if (!el) return `missing: ${query}`;
    el.scrollIntoView({ block: "center", behavior: "smooth" }); await sleep(700);
    const host = el.closest("section, [class*='paper'], li, tr, article") || el;
    const r = stageRect(frame, host === el ? el : host);
    Object.assign($("spot").style, { left: r.x - 8 + "px", top: r.y - 8 + "px", width: r.w + 16 + "px", height: r.h + 16 + "px", opacity: 1 });
    await sleep(ms); $("spot").style.opacity = 0; await sleep(300); return "ok";
  },
  async type(frame, selector, text, cps = 22) {
    const el = frames[frame].contentDocument.querySelector(selector.replace(/^css:/, ""));
    if (!el) return `missing: ${selector}`;
    el.scrollIntoView({ block: "center", behavior: "smooth" }); await sleep(500);
    const proto = el.tagName === "TEXTAREA" ? frames[frame].contentWindow.HTMLTextAreaElement.prototype : frames[frame].contentWindow.HTMLInputElement.prototype;
    const set = Object.getOwnPropertyDescriptor(proto, "value").set;
    el.focus();
    for (let i = 1; i <= text.length; i++) { set.call(el, text.slice(0, i)); el.dispatchEvent(new Event("input", { bubbles: true })); await sleep(1000 / cps); }
    return "ok";
  },
  async scroll(frame, to, ms = 3000) {
    const win = frames[frame].contentWindow;
    const doc = frames[frame].contentDocument;
    const target = typeof to === "number" ? to : (find(frame, to) || doc.body).getBoundingClientRect().top + win.scrollY - 120;
    const from = win.scrollY; const t0 = performance.now();
    await new Promise((resolve) => { const tick = (t) => { const p = Math.min(1, (t - t0) / ms); const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; win.scrollTo(0, from + (target - from) * e); p < 1 ? requestAnimationFrame(tick) : resolve(); }; requestAnimationFrame(tick); });
    return "ok";
  },
  logHead(title, note) { $("log").innerHTML = `<div class="k">${title}</div>${note ? `<div class="note">${note}</div>` : ""}`; },
  async logRow(html) { const row = document.createElement("div"); row.className = "row"; row.innerHTML = html; $("log").appendChild(row); await sleep(60); row.classList.add("on"); await sleep(500); },
  world() { return JSON.parse(localStorage.getItem("attune.world.v4")); },
};
</script>
</body>
</html>
